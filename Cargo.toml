[package]
name = "al"
version = "0.2.3"
edition = "2024"
rust-version = "1.98.1"
publish = false

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
reqwest-websocket = "0.6.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
tokio = { version = "1.53.2", features = ["rt", "macros", "net", "time", "signal", "sync"] }

[dev-dependencies]
rcgen = "0.14.10"
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["io-util"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
wiremock = "0.6.5"

[profile.release]
strip = true
