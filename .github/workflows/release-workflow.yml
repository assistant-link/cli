name: release-workflow

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/release-workflow.yml
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, runner: macos-15 }
          - { target: x86_64-apple-darwin, runner: macos-15 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the version from Cargo.toml
        run: |
          version="$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
      - run: rustup toolchain install
      - run: rustup target add "$TARGET"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      # No build cache: release binaries are built from a clean tree.
      - run: cargo build --locked --release --target "$TARGET"
      - name: Package al-${{ matrix.target }}.tar.gz
        run: |
          mkdir dist smoke
          COPYFILE_DISABLE=1 tar -czf "dist/al-$TARGET.tar.gz" -C "target/$TARGET/release" al
          tar -xzf "dist/al-$TARGET.tar.gz" -C smoke al
      - name: Run al --version in an empty container
        if: runner.os == 'Linux'
        run: |
          printf 'FROM scratch\nCOPY al /al\nENTRYPOINT ["/al"]\n' | docker build -q -t al-smoke -f - smoke
          test "$(docker run --rm al-smoke --version)" = "al $VERSION"
      - name: Run al --version
        if: runner.os == 'macOS'
        run: test "$(smoke/al --version)" = "al $VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: al-${{ matrix.target }}
          path: dist/al-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: al-*
          path: dist
          merge-multiple: true
      - run: sha256sum al-*.tar.gz > SHA256SUMS && cat SHA256SUMS
        working-directory: dist
      # releases/latest never serves a pre-release, so a version with a `-` suffix does not reach install.md.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME" --generate-notes "${prerelease[@]}" dist/*
