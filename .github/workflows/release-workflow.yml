name: release-workflow

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: rustup toolchain install
      - id: version
        name: Read the version and check the tag
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "al") | .version')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
              echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "Tag $GITHUB_REF_NAME points to a commit that is not on main" >&2
              exit 1
            fi
          fi

  build:
    name: build (${{ matrix.target }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, runner: macos-15 }
          - { target: x86_64-apple-darwin, runner: macos-15 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.check.outputs.version }}
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - run: rustup target add "$TARGET"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      # No build cache: release binaries are built from a clean tree.
      - run: cargo build --locked --release --target "$TARGET"
      - name: Package al-${{ matrix.target }}.tar.gz
        run: |
          mkdir dist smoke
          COPYFILE_DISABLE=1 tar -czf "dist/al-$TARGET.tar.gz" -C "target/$TARGET/release" al
          tar -xzf "dist/al-$TARGET.tar.gz" -C smoke al
      - name: Run al --version in an empty container
        if: runner.os == 'Linux'
        run: |
          printf 'FROM scratch\nCOPY al /al\nENTRYPOINT ["/al"]\n' | docker build -q -t al-smoke -f - smoke
          test "$(docker run --rm al-smoke --version)" = "al $VERSION"
      - name: Run al --version and check the minimum macOS
        if: runner.os == 'macOS'
        run: |
          test "$(smoke/al --version)" = "al $VERSION"
          vtool -show-build smoke/al | grep -Eq "minos $MACOSX_DEPLOYMENT_TARGET\$"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: al-${{ matrix.target }}
          path: dist/al-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: al-*
          path: dist
          merge-multiple: true
      - run: sha256sum al-*.tar.gz > SHA256SUMS && cat SHA256SUMS
        working-directory: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/al-*.tar.gz
      # The release stays a draft until every asset is uploaded, so a re-run of a failed job resumes the same draft.
      # releases/latest serves the highest version, never a pre-release (a version with a `-` suffix).
      - name: Publish the GitHub release
        run: |
          state="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [[ "$state" == false ]]; then
            echo "Release $TAG is already published" >&2
            exit 1
          fi

          prerelease=false
          latest=false
          if [[ "$TAG" == *-* ]]; then
            prerelease=true
          else
            current="$(gh release view --json tagName --jq .tagName 2>/dev/null || true)"
            if [[ -z "$current" || "$(printf '%s\n' "$current" "$TAG" | sort -V | tail -n 1)" == "$TAG" ]]; then
              latest=true
            fi
          fi

          if [[ -z "$state" ]]; then
            gh release create "$TAG" --draft --verify-tag --title "$TAG" --generate-notes --prerelease="$prerelease"
          fi
          gh release upload "$TAG" --clobber dist/*
          gh release edit "$TAG" --draft=false --prerelease="$prerelease" --latest="$latest"
