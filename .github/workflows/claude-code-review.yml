name: claude-code-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Never run Claude on fork PRs (secrets are also withheld there) or drafts.
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@4fa93a88de49bbef68b10eb15aabedf28ca0e1ed # v1.0.271
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. The PR branch is already checked out.

            Focus only on:
            - Real bugs and likely correctness issues
            - Security problems
            - Needless complexity; suggest a simpler approach when it is clearly better

            Do not nitpick style, naming, or formatting. Do not leave comments on things that are fine. If there is nothing important to flag, say so briefly and do not invent issues.

            Before commenting, read existing PR review comments and discussion. Use `gh pr view` and `gh pr diff` for the PR and discussion, and this exact command for line-level review comments:

            `gh api --paginate repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments`

            Do not repeat a comment that was already made on an earlier commit unless the same issue is still present and unresolved.

            How to post:
            - Use mcp__github_inline_comment__create_inline_comment (with confirmed: true) for line-specific findings
            - Use `gh pr comment` for a short summary of the review, even if you found nothing important
            - Only post GitHub comments; don't submit review text as messages
          claude_args: |
            --model claude-opus-5-5
            --effort high
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api --paginate repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments)"
